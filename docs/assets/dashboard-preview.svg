<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 900">
  <defs>
    <linearGradient id="sidebarGradient" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#111b34" />
      <stop offset="100%" stop-color="#0d1426" />
    </linearGradient>
    <linearGradient id="cardGradient" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#162132" />
      <stop offset="100%" stop-color="#0c1323" />
    </linearGradient>
    <linearGradient id="barGradient" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#6cf9ff" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#6cf9ff" stop-opacity="0.05" />
    </linearGradient>
    <filter id="cardShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="24" stdDeviation="32" flood-color="#000" flood-opacity="0.45" />
    </filter>
    <style><![CDATA[
      .title { font-family: 'Inter', sans-serif; font-weight: 600; letter-spacing: 0.2em; fill: #6cf9ff; font-size: 30px; }
      .section-label { font-family: 'Inter', sans-serif; fill: #7686ad; font-size: 15px; text-transform: uppercase; letter-spacing: 0.3em; }
      .nav-link { font-family: 'Inter', sans-serif; fill: #aabbe2; font-size: 18px; }
      .nav-link.active { fill: #6cf9ff; }
      .header-title { font-family: 'Inter', sans-serif; fill: #e9f1ff; font-size: 30px; font-weight: 600; }
      .header-meta { font-family: 'Inter', sans-serif; fill: #8ea1cb; font-size: 20px; }
      .badge { font-family: 'Inter', sans-serif; fill: #6cf9ff; font-size: 18px; }
      .card-title { font-family: 'Inter', sans-serif; fill: #6cf9ff; font-size: 22px; font-weight: 600; }
      .card-stat { font-family: 'Inter', sans-serif; fill: #f7fbff; font-size: 46px; font-weight: 600; }
      .card-meta { font-family: 'Inter', sans-serif; fill: #9fb3da; font-size: 20px; }
      .timeline-item { font-family: 'Inter', sans-serif; fill: #dce6ff; font-size: 22px; }
      .timeline-sub { font-family: 'Inter', sans-serif; fill: #9fb3da; font-size: 20px; }
      .phase-label { font-family: 'Inter', sans-serif; fill: #ffffff; font-size: 22px; }
      .phase-desc { font-family: 'Inter', sans-serif; fill: #9fb3da; font-size: 20px; }
    ]]></style>
  </defs>
  <rect width="1400" height="900" fill="#0b1221" />
  <rect x="0" y="0" width="260" height="900" fill="url(#sidebarGradient)" />
  <text x="50" y="110" class="title">SMARTGARAGE</text>
  <text x="50" y="170" class="section-label">OPERACIÓN</text>
  <rect x="40" y="190" width="180" height="48" rx="14" fill="#1d2a44" opacity="0.22" />
  <text x="70" y="223" class="nav-link active">Panel principal</text>
  <rect x="40" y="250" width="180" height="48" rx="14" fill="#ffffff" opacity="0.06" />
  <text x="70" y="283" class="nav-link">Órdenes de servicio</text>
  <rect x="40" y="310" width="180" height="48" rx="14" fill="#ffffff" opacity="0.06" />
  <text x="70" y="343" class="nav-link">Inventario</text>
  <rect x="40" y="370" width="180" height="48" rx="14" fill="#ffffff" opacity="0.06" />
  <text x="70" y="403" class="nav-link">Facturación SAR</text>
  <text x="50" y="470" class="section-label">ANÁLISIS</text>
  <rect x="40" y="490" width="180" height="48" rx="14" fill="#ffffff" opacity="0.06" />
  <text x="70" y="523" class="nav-link">Reportes</text>
  <rect x="40" y="550" width="180" height="48" rx="14" fill="#ffffff" opacity="0.06" />
  <text x="70" y="583" class="nav-link">Marketing</text>
  <rect x="40" y="610" width="180" height="48" rx="14" fill="#ffffff" opacity="0.06" />
  <text x="70" y="643" class="nav-link">Señalización</text>

  <rect x="260" y="0" width="1140" height="120" fill="#0d172b" opacity="0.92" />
  <text x="300" y="75" class="header-title">Resumen diario · 15 Feb 2025</text>
  <text x="1030" y="75" class="header-meta">Sucursal SPS Centro</text>
  <rect x="1200" y="44" width="150" height="40" rx="20" fill="#1b2f4b" stroke="#6cf9ff" stroke-opacity="0.5" />
  <text x="1215" y="70" class="badge">Fase 3 en curso</text>

  <!-- Cards row -->
  <g filter="url(#cardShadow)">
    <rect x="300" y="150" width="240" height="160" rx="24" fill="url(#cardGradient)" />
    <rect x="560" y="150" width="240" height="160" rx="24" fill="url(#cardGradient)" />
    <rect x="820" y="150" width="240" height="160" rx="24" fill="url(#cardGradient)" />
    <rect x="1080" y="150" width="240" height="160" rx="24" fill="url(#cardGradient)" />
  </g>
  <text x="330" y="200" class="card-title">Ventas netas</text>
  <text x="330" y="255" class="card-stat">L 128k</text>
  <text x="330" y="295" class="card-meta">+18% vs. ayer</text>

  <text x="590" y="200" class="card-title">Órdenes activas</text>
  <text x="590" y="255" class="card-stat">24</text>
  <text x="590" y="295" class="card-meta">12 en diagnóstico</text>

  <text x="850" y="200" class="card-title">Stock crítico</text>
  <text x="850" y="255" class="card-stat">8</text>
  <text x="850" y="295" class="card-meta">Alertas multi-sucursal</text>

  <text x="1110" y="200" class="card-title">Aprobaciones pendientes</text>
  <text x="1110" y="255" class="card-stat">5</text>
  <text x="1110" y="295" class="card-meta">Portal Garage</text>

  <!-- Trend chart -->
  <g filter="url(#cardShadow)">
    <rect x="300" y="340" width="520" height="220" rx="28" fill="url(#cardGradient)" />
  </g>
  <text x="330" y="390" class="card-title">Tendencia de ingresos</text>
  <g transform="translate(330 420)">
    <rect width="60" height="150" rx="12" fill="url(#barGradient)" />
    <rect x="80" width="60" height="120" rx="12" fill="url(#barGradient)" />
    <rect x="160" width="60" height="170" rx="12" fill="url(#barGradient)" />
    <rect x="240" width="60" height="200" rx="12" fill="url(#barGradient)" />
    <rect x="320" width="60" height="160" rx="12" fill="url(#barGradient)" />
    <rect x="400" width="60" height="180" rx="12" fill="url(#barGradient)" />
  </g>

  <!-- Orders funnel -->
  <g filter="url(#cardShadow)">
    <rect x="860" y="340" width="460" height="220" rx="28" fill="url(#cardGradient)" />
  </g>
  <text x="890" y="390" class="card-title">Embudo de órdenes</text>
  <g transform="translate(890 420)">
    <rect y="0" width="420" height="52" rx="14" fill="#1b2540" opacity="0.55" />
    <rect y="70" width="420" height="52" rx="14" fill="#1b2540" opacity="0.55" />
    <rect y="140" width="420" height="52" rx="14" fill="#1b2540" opacity="0.55" />
    <rect y="210" width="420" height="52" rx="14" fill="#1b2540" opacity="0.55" />
    <text x="24" y="34" class="timeline-item">Recepción</text>
    <text x="300" y="34" class="timeline-sub">32 vehículos</text>
    <text x="24" y="104" class="timeline-item">Diagnóstico</text>
    <text x="300" y="104" class="timeline-sub">24 vehículos</text>
    <text x="24" y="174" class="timeline-item">En reparación</text>
    <text x="300" y="174" class="timeline-sub">14 vehículos</text>
    <text x="24" y="244" class="timeline-item">Listos</text>
    <text x="300" y="244" class="timeline-sub">9 vehículos</text>
  </g>

  <!-- Roadmap -->
  <g filter="url(#cardShadow)">
    <rect x="300" y="580" width="1020" height="250" rx="32" fill="url(#cardGradient)" />
  </g>
  <text x="330" y="635" class="card-title">Roadmap operativo</text>
  <g transform="translate(330 660)">
    <rect width="960" height="48" rx="14" fill="#1b2540" opacity="0.5" />
    <rect y="70" width="960" height="48" rx="14" fill="#1b2540" opacity="0.5" />
    <rect y="140" width="960" height="48" rx="14" fill="#1b2540" opacity="0.5" />
    <rect y="210" width="960" height="48" rx="14" fill="#1b2540" opacity="0.5" />
    <text x="20" y="32" class="phase-label">Fase 3</text>
    <text x="160" y="32" class="phase-desc">Conciliaciones, auditorías, multi-sucursal</text>
    <text x="20" y="102" class="phase-label">Fase 4</text>
    <text x="160" y="102" class="phase-desc">CI/CD, alertas, monitoreo</text>
    <text x="20" y="172" class="phase-label">Fase 5</text>
    <text x="160" y="172" class="phase-desc">UX, tutoriales, Garage 3D</text>
    <text x="20" y="242" class="phase-label">Fase 6</text>
    <text x="160" y="242" class="phase-desc">Hardening, respaldos, checklist</text>
  </g>
</svg>
